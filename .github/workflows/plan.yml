name: Daily Gold Plan

# Generates plan.json in the cloud (no PC needed) at 13:00 & 19:00 Thailand time,
# Mon–Fri. GitHub cron runs in UTC; ICT = UTC+7 (Thailand has no DST).
on:
  schedule:
    - cron: "8 6 * * 1-5"    # 06:08 UTC = 13:08 ICT
    - cron: "8 12 * * 1-5"   # 12:08 UTC = 19:08 ICT
    - cron: "38 14 * * 1-5"  # 14:38 UTC = 21:38 ICT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install chart dependency
        run: pip install --quiet matplotlib

      - name: Generate plan.json
        run: python generate_plan.py --no-push --if-stale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.json data || true

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Auto plan (cloud) $(date -u +%Y-%m-%dT%H:%MZ)"

            # Determine the branch name from GITHUB_REF (refs/heads/<branch>)
            BRANCH="${GITHUB_REF#refs/heads/}"

            # Ensure we have the latest remote branch
            git fetch origin "$BRANCH"

            # Rebase local commit(s) on top of remote to produce a fast-forward push.
            # If rebase fails (conflict), abort rebase and skip push to avoid forcing a broken state.
            if git rebase "origin/$BRANCH"; then
              git push origin "HEAD:$BRANCH"
            else
              echo "Rebase failed — aborting rebase and skipping push to avoid conflicts"
              git rebase --abort || true
            fi
          fi
